        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UpstreamRejected"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Worker token mounted from an owner-only file.
  headers:
    NoStore:
      description: Prevents storage of bearer links and connection metadata.
      schema:
        type: string
        enum: [no-store]
    NoSniff:
      description: Prevents content-type sniffing.
      schema:
        type: string
        enum: [nosniff]
  responses:
    InvalidRequest:
      description: The bounded exact-shape JSON request is invalid.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: The worker bearer is absent or invalid.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamRejected:
      description: The broker or provider rejected the frozen operation or returned an invalid bounded response.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamUnavailable:
      description: The broker is unavailable or rate limited.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ExternalUserID:
      type: string
      pattern: '^ryu_[A-Za-z0-9_-]{16,120}$'
    AccountID:
      type: string
      pattern: '^apn_[A-Za-z0-9]+$'
    UserRequest:
      type: object
      additionalProperties: false
      required: [external_user_id]
      properties:
        external_user_id:
          $ref: "#/components/schemas/ExternalUserID"
    AccountRequest:
      type: object
      additionalProperties: false
      required: [account_id, external_user_id]
      properties:
        account_id:
          $ref: "#/components/schemas/AccountID"
        external_user_id:
          $ref: "#/components/schemas/ExternalUserID"
    SlackChannelID:
      type: string
      pattern: '^C[A-Z0-9]{1,255}$'
    SlackMessageRequest:
      type: object
      additionalProperties: false
      required: [account_id, channel_id, external_user_id]
      properties:
        account_id:
          $ref: "#/components/schemas/AccountID"
        channel_id:
          $ref: "#/components/schemas/SlackChannelID"
        external_user_id:
          $ref: "#/components/schemas/ExternalUserID"
    FileID:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,256}$'
    ContentRequest:
      type: object
      additionalProperties: false
      required: [account_id, external_user_id, file_ids]
      properties:
        account_id:
          $ref: "#/components/schemas/AccountID"
        external_user_id:
          $ref: "#/components/schemas/ExternalUserID"
        file_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            $ref: "#/components/schemas/FileID"
    Health:
      type: object
      additionalProperties: false
      required: [schema_version, status]
      properties:
        schema_version:
          type: string
          enum: [steward.integration-health.v1]
        status:
          type: string
          enum: [ready]
    ConnectLink:
      type: object
      additionalProperties: false
      required: [schema_version, integration, connect_url, expires_at]
      properties:
        schema_version:
          type: string
          enum: [steward.managed-connect-link.v1]
        integration:
          type: string
          enum: [google-drive, gmail, google-calendar, microsoft-outlook-mail, microsoft-outlook-calendar, hubspot, slack]
        connect_url:
          type: string
          format: uri
          maxLength: 16384
        expires_at:
          type: string
          format: date-time
    AbsentConnection:
      type: object
      additionalProperties: false
      required: [schema_version, integration, status]
      properties:
        schema_version:
          type: string
          enum: [steward.managed-connection.v1]
        integration:
          type: string
          enum: [google-drive, gmail, google-calendar, microsoft-outlook-mail, microsoft-outlook-calendar, hubspot]
        status:
          type: string
          enum: [not_connected]
    PresentConnection:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - integration
        - status
        - account_id
        - account_name
        - authorized_scopes
        - required_scope
        - healthy
      properties:
        schema_version:
          type: string
          enum: [steward.managed-connection.v1]
        integration:
          type: string
          enum: [google-drive, gmail, google-calendar, microsoft-outlook-mail, microsoft-outlook-calendar, hubspot]
        status:
          type: string
          enum: [ready, needs_attention]
        account_id:
          $ref: "#/components/schemas/AccountID"
        account_name:
          type: string
          maxLength: 4096
        authorized_scopes:
          type: array
          uniqueItems: true
          maxItems: 256
          items:
            type: string
            maxLength: 4096
        required_scope:
          type: string
          enum:
            - https://www.googleapis.com/auth/drive.readonly
            - https://www.googleapis.com/auth/gmail.readonly
            - https://www.googleapis.com/auth/calendar.events.readonly
            - Mail.Read
            - Calendars.ReadBasic
            - crm.objects.deals.read
        healthy:
          type: boolean
    AbsentSlackConnection:
      type: object
      additionalProperties: false
      required: [schema_version, integration, status]
      properties:
        schema_version:
          type: string
          enum: [steward.managed-connection.v2]
        integration:
          type: string
          enum: [slack]
        status:
          type: string
          enum: [not_connected]
    PresentSlackConnection:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - integration
        - status
        - account_id
        - account_name
        - authorized_scopes
        - required_scopes
        - healthy
      properties:
        schema_version:
          type: string
          enum: [steward.managed-connection.v2]
        integration:
          type: string
          enum: [slack]
        status:
          type: string
          enum: [ready, needs_attention]
        account_id:
          $ref: "#/components/schemas/AccountID"
        account_name:
          type: string
          maxLength: 4096
        authorized_scopes:
          type: array
          uniqueItems: true
          maxItems: 256
          items:
            type: string
            maxLength: 4096
        required_scopes:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [channels:history, channels:read]
        healthy:
          type: boolean
    FileMetadata:
      type: object
      additionalProperties: false
      required: [id, name, mimeType]
      properties:
        id:
          type: string
          maxLength: 4096
        name:
          type: string
          maxLength: 4096
        mimeType:
          type: string
          maxLength: 4096
        modifiedTime:
          type: string
          maxLength: 4096
        size:
          type: string
          maxLength: 4096
        webViewLink:
          type: string
          maxLength: 4096
    GoogleDriveMetadata:
      type: object
      additionalProperties: false
      required: [schema_version, integration, files, result_count, has_more]
      properties:
        schema_version:
          type: string
          enum: [steward.google-drive-metadata.v1]
        integration:
          type: string
          enum: [google-drive]
        files:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/FileMetadata"
        result_count:
          type: integer
          minimum: 0
          maximum: 50
        has_more:
          type: boolean
    GoogleDriveContentSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - file_id
        - name
        - media_type
        - modified_at
        - view_url
        - content
        - content_bytes
        - content_sha256
      properties:
        status:
          type: string
          enum: [succeeded]
        file_id:
          $ref: "#/components/schemas/FileID"
        name:
          type: string
          maxLength: 4096
        media_type:
          type: string
          enum: [application/vnd.google-apps.document, text/plain, text/markdown]
        modified_at:
          type: string
          nullable: true
          maxLength: 4096
        view_url:
          type: string
          format: uri
          maxLength: 4096
        content:
          type: string
          maxLength: 65536
        content_bytes:
          type: integer
          minimum: 0
          maximum: 65536
          description: The response contains at most 245760 normalized content bytes in aggregate and is bounded to 524288 encoded bytes.
        content_sha256:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
    GoogleDriveContentFailure:
      type: object
      additionalProperties: false
      required: [status, file_id]
      properties:
        status:
          type: string
          enum: [not_found, unsupported, not_downloadable, too_large, invalid_text]
        file_id:
          $ref: "#/components/schemas/FileID"
        name:
          type: string
          maxLength: 4096
        media_type:
          type: string
          maxLength: 4096
        modified_at:
          type: string
          nullable: true
          maxLength: 4096
        view_url:
          type: string
          format: uri
          maxLength: 4096
    GoogleDriveContent:
      type: object
      additionalProperties: false
      required: [schema_version, integration, results, result_count]
      properties:
        schema_version:
          type: string
          enum: [steward.google-drive-content.v1]
        integration:
          type: string
          enum: [google-drive]
        results:
          type: array
          minItems: 1
          maxItems: 10
          items:
            oneOf:
              - $ref: "#/components/schemas/GoogleDriveContentSuccess"
              - $ref: "#/components/schemas/GoogleDriveContentFailure"
        result_count:
          type: integer
          minimum: 1
          maximum: 10
    GmailMessageSuccess:
      type: object
      additionalProperties: false
      required:
        - message_id
        - thread_id
        - status
        - received_at_epoch_ms
        - labels
        - from
        - to
        - subject
        - sent_at
        - content
        - content_source
        - content_bytes
        - content_sha256
      properties:
        message_id:
          $ref: "#/components/schemas/FileID"
        thread_id:
          $ref: "#/components/schemas/FileID"
        status:
          type: string
          enum: [succeeded]
        received_at_epoch_ms:
          type: string
          pattern: '^[0-9]{1,20}$'
        labels:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            maxLength: 256
        from:
          type: string
          maxLength: 4096
        to:
          type: string
          maxLength: 4096
        subject:
          type: string
          maxLength: 4096
        sent_at:
          type: string
          maxLength: 4096
        content:
          type: string
          maxLength: 32768
        content_source:
          type: string
          enum: [text/plain, snippet]
        content_bytes:
          type: integer
          minimum: 0
          maximum: 32768
          description: Successful messages contain at most 245760 normalized content bytes in aggregate.
        content_sha256:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
    GmailMessageFailure:
      type: object
      additionalProperties: false
      required: [message_id, status]
      properties:
        message_id:
          $ref: "#/components/schemas/FileID"
        status:
          type: string
          enum: [not_found, too_large]
    GmailRecentMessages:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - integration
        - window_days
        - results
        - result_count
        - has_more
      properties:
        schema_version:
          type: string
          enum: [steward.gmail-recent-messages.v1]
        integration:
          type: string
          enum: [gmail]
        window_days:
          type: integer
          enum: [30]
        results:
          type: array
          maxItems: 20
          items:
            oneOf:
              - $ref: "#/components/schemas/GmailMessageSuccess"
              - $ref: "#/components/schemas/GmailMessageFailure"
        result_count:
          type: integer
          minimum: 0
          maximum: 20
        has_more:
          type: boolean
    CalendarEventID:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,1024}$'
    CalendarAllDayTime:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [date]
        value:
          type: string
          format: date
    CalendarDateTime:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [date_time]
        value:
          type: string
          format: date-time
        time_zone:
          type: string
          maxLength: 256
    CalendarOrganizer:
      type: object
      additionalProperties: false
      required: [email, display_name, self]
      properties:
        email:
          type: string
          maxLength: 1024
        display_name:
          type: string
          maxLength: 1024
        self:
          type: boolean
    CalendarAttendee:
      type: object
      additionalProperties: false
      required: [email, display_name, self, response_status, optional]
      properties:
        email:
          type: string
          maxLength: 1024
        display_name:
          type: string
          maxLength: 1024
        self:
          type: boolean
        response_status:
          type: string
          enum: [accepted, declined, needsAction, tentative]
        optional:
          type: boolean
    CalendarEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - status
        - event_type
        - transparency
        - visibility
        - summary
        - description
        - location
        - start
        - end
        - organizer
        - attendees
        - attendees_omitted
      properties:
        event_id:
          $ref: "#/components/schemas/CalendarEventID"
        status:
