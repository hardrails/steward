  /v1/connections/google-calendar/upcoming-events:
    post:
      tags: [google-calendar]
      operationId: readUpcomingGoogleCalendarEvents
      summary: Read a bounded upcoming primary-calendar window
      description: |
        Reads at most 50 events from the connected account's primary calendar for
        the next 14 days, expanding recurring events and ordering by start time.
        The caller cannot supply a calendar ID, query, time range, URL, attendee
        limit, page token, provider header, or write action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
