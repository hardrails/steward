openapi: 3.0.3
info:
  title: Steward Private Task Signing Station
  version: "1.1.0"
  description: |
    Optional operator-pinned, single-runtime Unix-socket station. No TCP listener.
    Dedicated client-group socket access grants issuance authority for the configured operation
    allowlist. The host and workload must not receive station key or store mounts.
    Run the host under a different non-root UID from the signer. The explicit
    client GID owns group access to the signer-owned 0710 socket directory and
    0660 socket, never the owner-only key or store. Same-UID and root processes
    are trusted operators, not isolated clients.
    Requests cannot choose runtime identity, trust inventory, key, or validity.
    Every successful response is retained before transmission and independently
    verified by the host before dispatch. This is not a business approval service.
    An explicit allow-responses startup option adds exact owner-answer issuance
    for the same pinned runtime. It defaults off and is bound into the store's
    immutable configuration. Tasks and answers share the finite record capacity.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Steward
    url: https://github.com/hardrails/steward
servers:
  - url: http://steward-task-authority
    description: Virtual HTTP origin transported only over the operator's private Unix socket
security: []
tags:
  - name: task-authority
    description: Fixed-runtime exact task issuance without key transfer
paths:
  /v1/tasks:
    post:
      tags: [task-authority]
      operationId: requestTaskAuthority
      summary: Request or recover one exact task bundle
      description: |
        Body is bounded to 131072 bytes. Base64 must be canonical padded base64
        encoding one unambiguous JSON value of 1–65536 decoded bytes, additionally
        bounded by the configured operation. Unknown/duplicate fields, Origin
        headers and query strings are rejected. Repeating an identical task ID,
        operation and body recovers byte-identical unexpired authority. Expired
        authority is never renewed under the same identity. Other HTTP methods
        return 405 with Allow POST; unknown paths or any query return 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task_id, operation_id, request_base64]
              properties:
                task_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
                operation_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
                request_base64:
                  type: string
                  format: byte
                  minLength: 4
                  maxLength: 87384
      responses:
        "200":
          description: Exact retained native task bundle; no dispatch has occurred.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            X-Content-Type-Options:
              schema: {type: string, enum: [nosniff]}
          content:
            application/octet-stream:
              schema: {type: string, format: binary, maxLength: 131072}
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/responses:
    post:
      tags: [task-authority]
      operationId: requestInteractionResponseAuthority
      summary: Request or recover one exact interaction response permit
      description: |
        Available only when the operator starts the station with -allow-responses;
        otherwise returns 404. This is a private trusted-host endpoint, not a browser
        or agent API. Socket access authorizes any valid answer for the pinned runtime;
        the host must first authenticate the question and retain the owner's answer.
        The station checks native question identity and digest, pinned admission identity,
        offered choices, text permission and exact response bytes. Gateway still verifies
        that the exact question is pending; issuance alone proves neither consent nor delivery.
        The body is bounded to 65536 bytes. Unknown/duplicate fields, Origin headers,
        non-JSON Content-Type, noncanonical base64 and query strings are rejected.
        Response bytes must contain a native steward.interaction-response-body.v1 JSON
        object; whitespace and Unicode are not reserialized. Choice must be an exact
        offered option. Text must be allowed, at most 2048 UTF-8 bytes, with no surrounding
        whitespace or control characters. The first answer is retained by interaction ID
        in a namespace disjoint from task IDs. A different question digest or response
        conflicts; an expired permit is never renewed. Identical valid replays recover
        the original permit even at capacity. Validity is at most -valid-for, including
        five seconds of clock-skew allowance, and never exceeds the question's expiry.
        Other methods return 405 with Allow POST. Unknown or encoded paths and any query
        return 404. No Control submission, runtime activation or external effect occurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [interaction, response_base64]
              properties:
                interaction:
                  $ref: "./steward-control.v1.yaml#/components/schemas/InteractionRequest"
                response_base64:
                  type: string
                  format: byte
                  minLength: 4
                  maxLength: 5464
                  description: Canonical padded base64 encoding 1–4096 exact response bytes.
      responses:
        "200":
          description: Exact retained native response permit; no delivery has occurred.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            X-Content-Type-Options:
              schema: {type: string, enum: [nosniff]}
          content:
            application/octet-stream:
              schema: {type: string, format: binary, maxLength: 16384}
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: |
        No replacement authority returned. 400 invalid JSON/headers; 404 invalid
        route/query; 405 wrong method; 409 conflicting, expired or invalid retained
        authority; 413 oversized/unreadable body; 422 invalid intent or exact request;
        500 private preparation failure, unconfirmed storage durability or
        unexpected server failure;
        503 signer busy or retained capacity reached. Error codes distinguish
        preparation_failed (repair private staging storage and pinned authority),
        storage_unconfirmed, internal_error, signer_busy and capacity_exhausted.
        Keep the original
        task or interaction ID and reconcile; an error does not prove no authority was retained.
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
        X-Content-Type-Options:
          schema: {type: string, enum: [nosniff]}
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, message]
            properties:
              error: {type: string}
              message: {type: string}
