openapi: 3.0.3
info:
  title: Steward Managed Integration Worker API
  version: "1.3.0"
  description: |
    Private finite-operation worker for managed provider connections. Broker and
    provider credentials remain inside the worker. This contract does not expose
    a general proxy, action catalog, MCP endpoint, or provider credential.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Steward
    url: https://github.com/hardrails/steward
servers:
  - url: http://steward-integrations:8080
    description: Private container-network listener
security:
  - bearerAuth: []
tags:
  - name: health
  - name: google-drive
  - name: gmail
  - name: google-calendar
paths:
  /healthz:
    get:
      servers:
        - url: http://steward-integrations:8081
          description: Dedicated private readiness listener
      tags: [health]
      operationId: integrationWorkerHealth
      summary: Read process readiness
      description: Reports that configuration loaded and the private worker process can accept requests.
      security: []
      responses:
        "200":
          description: Worker configuration was loaded and the process is ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/connections/google-drive/connect-link:
    post:
      tags: [google-drive]
      operationId: createGoogleDriveConnectLink
      summary: Create one short-lived account connection link
      description: |
        Returns a bearer URL intended for immediate browser navigation. The URL
        must not be logged, retained in app definitions, or included in model
        context. It expires after ten minutes and is scoped to one opaque external
        user, Google Drive, and the configured custom OAuth client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "200":
          description: Short-lived Google Drive connection link.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectLink"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections/google-drive/reconcile:
    post:
      tags: [google-drive]
      operationId: reconcileGoogleDriveConnection
      summary: Reconcile one user's Google Drive connection
      description: |
        Lists only the configured Google Drive custom OAuth client and excludes
        credentials. Ready requires a healthy account with the read-only scope
        and no broader Google Drive scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "200":
          description: Normalized connection state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AbsentConnection"
                  - $ref: "#/components/schemas/PresentConnection"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections/google-drive/files:
    post:
      tags: [google-drive]
      operationId: listGoogleDriveFileMetadata
      summary: List bounded file metadata through the connected account
      description: |
        Verifies that the account belongs to the external user and is ready, then
        invokes one frozen Google Drive `files.list` target through the managed-auth
        broker. The result contains at most 50 metadata records and never file
        content, permissions, owners, comments, or provider credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "200":
          description: Bounded normalized file metadata.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleDriveMetadata"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The account is absent, unhealthy, over-scoped, or not owned by this external user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections/google-drive/content:
    post:
      tags: [google-drive]
      operationId: readGoogleDriveFileContent
      summary: Read bounded selected text through the connected account
      description: |
        Verifies app-scoped account ownership and readiness, refetches metadata for
        one through ten exact file IDs, and chooses only reviewed Drive download or
        export targets within one shared 30-second batch deadline. Google Docs are
        exported as plain text; UTF-8 plain-text and
        Markdown blobs are downloaded directly. Every requested ID receives one
        ordered outcome. No caller URL, query, MIME override, export format, folder,
        provider credential, or silently truncated content is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentRequest"
      responses:
        "200":
          description: Bounded normalized per-file content outcomes.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleDriveContent"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No account with this ID belongs to the external user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The account is absent, unhealthy, over-scoped, or not ready for content reads.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections/google-drive/revoke:
    post:
      tags: [google-drive]
      operationId: revokeGoogleDriveConnection
      summary: Revoke one verified managed account
      description: Verifies external-user ownership before deleting the account at the managed-auth broker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "200":
          description: The broker accepted account revocation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revocation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No account with this ID belongs to the external user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections/gmail/connect-link:
    post:
      tags: [gmail]
      operationId: createGmailConnectLink
      summary: Create one short-lived Gmail connection link
      description: Returns a non-cacheable bearer URL scoped to the opaque external user, Gmail, and the configured custom OAuth client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "200":
          description: Short-lived Gmail connection link.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectLink"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections/gmail/reconcile:
    post:
      tags: [gmail]
      operationId: reconcileGmailConnection
      summary: Reconcile one user's Gmail connection
      description: Ready requires a healthy account with exactly the Gmail read-only scope and no broader Gmail scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "200":
          description: Normalized connection state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AbsentConnection"
                  - $ref: "#/components/schemas/PresentConnection"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections/gmail/recent-messages:
    post:
      tags: [gmail]
      operationId: readRecentGmailMessages
      summary: Read a bounded recent inbox window
      description: |
        Reads at most 20 messages carrying the INBOX label from the last 30 days
        through one verified account. The worker returns bounded headers and the
        first UTF-8 plain-text MIME body, with the provider snippet as a fallback.
        It accepts no caller query, label, URL, format, attachment, or write action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "200":
          description: Bounded normalized recent inbox messages.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailRecentMessages"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No account with this ID belongs to the external user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The Gmail account is unhealthy, over-scoped, or not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections/gmail/revoke:
    post:
      tags: [gmail]
      operationId: revokeGmailConnection
      summary: Revoke one verified Gmail account
      description: Verifies external-user ownership before deleting the account at the managed-auth broker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "200":
          description: The broker accepted account revocation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revocation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No account with this ID belongs to the external user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections/google-calendar/connect-link:
    post:
      tags: [google-calendar]
      operationId: createGoogleCalendarConnectLink
      summary: Create one short-lived Google Calendar connection link
      description: Returns a non-cacheable bearer URL scoped to the opaque external user, Google Calendar, and the configured custom OAuth client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "200":
          description: Short-lived Google Calendar connection link.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectLink"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections/google-calendar/reconcile:
    post:
      tags: [google-calendar]
      operationId: reconcileGoogleCalendarConnection
      summary: Reconcile one user's Google Calendar connection
      description: Ready requires a healthy account with exactly the Calendar events read-only scope and no broader Calendar scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "200":
          description: Normalized connection state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AbsentConnection"
                  - $ref: "#/components/schemas/PresentConnection"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections/google-calendar/upcoming-events:
    post:
      tags: [google-calendar]
      operationId: readUpcomingGoogleCalendarEvents
      summary: Read a bounded upcoming primary-calendar window
      description: |
        Reads at most 50 events from the connected account's primary calendar for
        the next 14 days, expanding recurring events and ordering by start time.
        The caller cannot supply a calendar ID, query, time range, URL, attendee
        limit, page token, provider header, or write action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "200":
          description: Bounded normalized upcoming events.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCalendarUpcomingEvents"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No account with this ID belongs to the external user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The Google Calendar account is unhealthy, over-scoped, or not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/connections/google-calendar/revoke:
    post:
      tags: [google-calendar]
      operationId: revokeGoogleCalendarConnection
      summary: Revoke one verified Google Calendar account
      description: Verifies external-user ownership before deleting the account at the managed-auth broker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "200":
          description: The broker accepted account revocation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revocation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No account with this ID belongs to the external user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Worker token mounted from an owner-only file.
  headers:
    NoStore:
      description: Prevents storage of bearer links and connection metadata.
      schema:
        type: string
        enum: [no-store]
    NoSniff:
      description: Prevents content-type sniffing.
      schema:
        type: string
        enum: [nosniff]
  responses:
    InvalidRequest:
      description: The bounded exact-shape JSON request is invalid.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: The worker bearer is absent or invalid.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamRejected:
      description: The broker or provider rejected the frozen operation or returned an invalid bounded response.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamUnavailable:
      description: The broker is unavailable or rate limited.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ExternalUserID:
      type: string
      pattern: '^ryu_[A-Za-z0-9_-]{16,120}$'
    AccountID:
      type: string
      pattern: '^apn_[A-Za-z0-9]+$'
    UserRequest:
      type: object
      additionalProperties: false
      required: [external_user_id]
      properties:
        external_user_id:
          $ref: "#/components/schemas/ExternalUserID"
    AccountRequest:
      type: object
      additionalProperties: false
      required: [account_id, external_user_id]
      properties:
        account_id:
          $ref: "#/components/schemas/AccountID"
        external_user_id:
          $ref: "#/components/schemas/ExternalUserID"
    FileID:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,256}$'
    ContentRequest:
      type: object
      additionalProperties: false
      required: [account_id, external_user_id, file_ids]
      properties:
        account_id:
          $ref: "#/components/schemas/AccountID"
        external_user_id:
          $ref: "#/components/schemas/ExternalUserID"
        file_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            $ref: "#/components/schemas/FileID"
    Health:
      type: object
      additionalProperties: false
      required: [schema_version, status]
      properties:
        schema_version:
          type: string
          enum: [steward.integration-health.v1]
        status:
          type: string
          enum: [ready]
    ConnectLink:
      type: object
      additionalProperties: false
      required: [schema_version, integration, connect_url, expires_at]
      properties:
        schema_version:
          type: string
          enum: [steward.managed-connect-link.v1]
        integration:
          type: string
          enum: [google-drive, gmail, google-calendar]
        connect_url:
          type: string
          format: uri
          maxLength: 16384
        expires_at:
          type: string
          format: date-time
    AbsentConnection:
      type: object
      additionalProperties: false
      required: [schema_version, integration, status]
      properties:
        schema_version:
          type: string
          enum: [steward.managed-connection.v1]
        integration:
          type: string
          enum: [google-drive, gmail, google-calendar]
        status:
          type: string
          enum: [not_connected]
    PresentConnection:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - integration
        - status
        - account_id
        - account_name
        - authorized_scopes
        - required_scope
        - healthy
      properties:
        schema_version:
          type: string
          enum: [steward.managed-connection.v1]
        integration:
          type: string
          enum: [google-drive, gmail, google-calendar]
        status:
          type: string
          enum: [ready, needs_attention]
        account_id:
          $ref: "#/components/schemas/AccountID"
        account_name:
          type: string
          maxLength: 4096
        authorized_scopes:
          type: array
          uniqueItems: true
          maxItems: 256
          items:
            type: string
            maxLength: 4096
        required_scope:
          type: string
          enum:
            - https://www.googleapis.com/auth/drive.readonly
            - https://www.googleapis.com/auth/gmail.readonly
            - https://www.googleapis.com/auth/calendar.events.readonly
        healthy:
          type: boolean
    FileMetadata:
      type: object
      additionalProperties: false
      required: [id, name, mimeType]
      properties:
        id:
          type: string
          maxLength: 4096
        name:
          type: string
          maxLength: 4096
        mimeType:
          type: string
          maxLength: 4096
        modifiedTime:
          type: string
          maxLength: 4096
        size:
          type: string
          maxLength: 4096
        webViewLink:
          type: string
          maxLength: 4096
    GoogleDriveMetadata:
      type: object
      additionalProperties: false
      required: [schema_version, integration, files, result_count, has_more]
      properties:
        schema_version:
          type: string
          enum: [steward.google-drive-metadata.v1]
        integration:
          type: string
          enum: [google-drive]
        files:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/FileMetadata"
        result_count:
          type: integer
          minimum: 0
          maximum: 50
        has_more:
          type: boolean
    GoogleDriveContentSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - file_id
        - name
        - media_type
        - modified_at
        - view_url
        - content
        - content_bytes
        - content_sha256
      properties:
        status:
          type: string
          enum: [succeeded]
        file_id:
          $ref: "#/components/schemas/FileID"
        name:
          type: string
          maxLength: 4096
        media_type:
          type: string
          enum: [application/vnd.google-apps.document, text/plain, text/markdown]
        modified_at:
          type: string
          nullable: true
          maxLength: 4096
        view_url:
          type: string
          format: uri
          maxLength: 4096
        content:
          type: string
          maxLength: 65536
        content_bytes:
          type: integer
          minimum: 0
          maximum: 65536
          description: The response contains at most 245760 normalized content bytes in aggregate and is bounded to 524288 encoded bytes.
