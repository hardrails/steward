  /v1/connections/gmail/recent-messages:
    post:
      tags: [gmail]
      operationId: readRecentGmailMessages
      summary: Read a bounded recent inbox window
      description: |
        Reads at most 20 messages carrying the INBOX label from the last 30 days
        through one verified account. The worker returns bounded headers and the
        first UTF-8 plain-text MIME body, with the provider snippet as a fallback.
        It accepts no caller query, label, URL, format, attachment, or write action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "200":
          description: Bounded normalized recent inbox messages.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailRecentMessages"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No account with this ID belongs to the external user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The Gmail account is unhealthy, over-scoped, or not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/UpstreamRejected"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
